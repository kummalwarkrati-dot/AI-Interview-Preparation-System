<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Interview Preparation System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="welcome-section">
            <h1>AI Interview Preparation System</h1>
            <p>Prepare smarter. Practice better. Perform with confidence.</p>
        </div>

        <div class="login-box">
            <h2>Login</h2>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

                <button type="submit">Login</button>

            </form>

            <p id="message"></p>

            <p class="register-text">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            try {

                const response = await fetch("http://localhost:8080/api/users/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.text();

message.innerText = result;

if (result.startsWith("Login successful!|")) {

    const userId = result.split("|")[1];

    localStorage.setItem("userId", userId);

    setTimeout(() => {
        window.location.href = "dashboard.html";
    }, 500);
}

            } catch (error) {

                message.innerText = "Server connection failed!";
                console.error(error);

            }
        });
    </script>

</body>
</html>
